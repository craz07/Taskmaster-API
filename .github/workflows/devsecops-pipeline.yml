name: DevSecOps Security Delivery Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  supply-chain-analysis:
    name: Software Supply Chain Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Install Node.js dependencies
        working-directory: api
        run: npm install
      - name: Snyk scan - Node.js
        continue-on-error: true
        run: snyk test --file=api/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk scan - Python
        continue-on-error: true
        run: snyk test --file=worker/requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Taskmaster-API'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'
  dast-runtime-verification:
    name: DAST Runtime Verification
    needs: supply-chain-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          sleep 20
          curl --fail http://localhost:3000/health

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
